<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ARYEO</title>
  <meta name="description" content="Contact the NGO for volunteering, partnerships and media inquiries.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">

        <div class="top-header">

            <a class="brand" href="index.html">
                <img src="images/aryeo-logo.png" alt="ARYEO Logo">

                <div class="brand-text">
                    <h2>ASAMBE RURAL YOUTH EMPOWERMENT ORGANISATION</h2>
                </div>
            </a>

            <a class="donate-btn" href="donate.html">
                Donate
            </a>

        </div>

        <nav class="main-nav">
            <a href="about.html">About</a>
            <a href="programs.html">Programs</a>
            <a href="impact.html">Impact</a>
            <a href="team.html">Team</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p class="lede">Questions about volunteering, partnerships or donations? Send us a message.</p>
      </div>
    </section>

    <section class="container" style="margin-top:1rem">
      <form action="#" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send</button>
      </form>

      <div style="margin-top:1rem" class="card">
        <h3>Office</h3>
        <p>123 Main Street<br>City, Country</p>
        <p>Email: info@example.org</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> ARYEO. All rights reserved.</p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="js/script.js"></script>
</body>
</html>
